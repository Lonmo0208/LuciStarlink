name: build

on:
  push: {}
  pull_request: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # JDK 21 is required: the mod targets Java 21 (Minecraft 1.21.1) and the Gradle 8.x line does not run on
      # newer JDKs.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      # Run Gradle directly instead of through the wrapper: the checked-in wrapper.properties points at a mirror
      # that is fast in CN but unreliable from GitHub runners. Keep this version in sync with
      # gradle/wrapper/gradle-wrapper.properties.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'

      - name: Build and test
        run: gradle build --console=plain

      # No artifact upload on purpose: the mod jar is a release artifact, and the rule here is that release
      # artifacts stay local (dist/, with the md5 recorded in docs/verify-baseline.txt) and never on GitHub.
      # This workflow exists to prove the tree compiles and the test suite passes on a clean machine.
