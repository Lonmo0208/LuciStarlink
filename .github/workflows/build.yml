name: build

on:
  push: {}
  pull_request: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      # JDK 21, not 25: this tree is the 1.21.1 / NeoForge 21.1.235 backport and its source/target compatibility is
      # Java 21 (build.gradle). JDK 25 was ScalableLux's own target and is not what this tree compiles against.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradlew is executable in git now (mode 100755). Upstream's checkout carried mode 100644, which is exactly why
      # this job failed with "./gradlew: Permission denied" (exit 126) - a Windows working copy cannot set that bit,
      # only the index can: git update-index --chmod=+x gradlew. If the bit ever regresses, use `bash ./gradlew ...`.
      - name: Build
        run: ./gradlew clean build --stacktrace --console=plain

      # No artifact upload and no Modrinth/CurseForge publishing on purpose: release artifacts stay local (the rule
      # this project follows, and the note master's workflow carries too). This job exists to prove that the tree
      # compiles on a clean machine. The upstream release.yml, which published to ScalableLux's own Modrinth and
      # CurseForge projects, was removed along with it.
